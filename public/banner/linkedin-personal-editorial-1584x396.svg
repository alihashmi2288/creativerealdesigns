<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      .font-display { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'Space Mono', monospace; }
      .font-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-bold { font-weight: 700; }
      .font-semibold { font-weight: 600; }
      .font-medium { font-weight: 500; }
    </style>

    <linearGradient id="opt3-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="60%" stop-color="#17171c"/>
      <stop offset="100%" stop-color="#0c1724"/>
    </linearGradient>

    <pattern id="opt3-dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#32323e" fill-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="url(#opt3-bg)"/>
  <rect width="1584" height="396" fill="url(#opt3-dots)"/>

  <!-- Subtle Geometric Frame Lines -->
  <line x1="420" y1="0" x2="420" y2="396" stroke="#252530" stroke-width="1" stroke-dasharray="4,8"/>
  <line x1="1120" y1="0" x2="1120" y2="396" stroke="#252530" stroke-width="1" stroke-dasharray="4,8"/>

  <!-- ZONE A: Bold Editorial Statement (x = 440 to 1090) -->
  <g transform="translate(440, 52)">
    
    <text class="font-mono font-bold" x="0" y="16" font-size="11" fill="#ff7759" letter-spacing="2">
      // BESPOKE DIGITAL INFRASTRUCTURE
    </text>

    <!-- Bold Editorial Headline -->
    <text class="font-display font-bold" x="0" y="74" font-size="40" letter-spacing="-1.5" fill="#ffffff">
      We Engineer Sovereign
    </text>
    <text class="font-display font-bold" x="0" y="122" font-size="40" letter-spacing="-1.5" fill="#ffffff">
      Digital Realms<tspan fill="#ff7759">.</tspan>
    </text>

    <!-- Editorial Subhead -->
    <text class="font-body font-medium" x="0" y="166" font-size="16" fill="#a0a0b2">
      Next.js 16 Web Engineering • Bespoke Figma Design • Zero Monthly Lock-in
    </text>

    <!-- 3 Editorial Metric Pillars -->
    <g transform="translate(0, 206)">
      <!-- Metric 1 -->
      <g transform="translate(0, 0)">
        <text class="font-display font-bold" x="0" y="24" font-size="28" fill="#ffffff">&lt; 800ms</text>
        <text class="font-mono" x="0" y="44" font-size="10.5" fill="#ff7759" letter-spacing="0.5">SUB-SECOND CWV</text>
      </g>
      <!-- Divider -->
      <line x1="160" y1="6" x2="160" y2="48" stroke="#2c2c3a" stroke-width="1"/>
      
      <!-- Metric 2 -->
      <g transform="translate(190, 0)">
        <text class="font-display font-bold" x="0" y="24" font-size="28" fill="#ffffff">100%</text>
        <text class="font-mono" x="0" y="44" font-size="10.5" fill="#a0a0b5" letter-spacing="0.5">IP OWNERSHIP</text>
      </g>
      <!-- Divider -->
      <line x1="330" y1="6" x2="330" y2="48" stroke="#2c2c3a" stroke-width="1"/>
      
      <!-- Metric 3 -->
      <g transform="translate(360, 0)">
        <text class="font-display font-bold" x="0" y="24" font-size="28" fill="#ffffff">$0/mo</text>
        <text class="font-mono" x="0" y="44" font-size="10.5" fill="#a0a0b5" letter-spacing="0.5">PLATFORM FEES</text>
      </g>
    </g>
  </g>

  <!-- ZONE B: Brand Terminal Unit (x = 1140 to 1520) -->
  <g transform="translate(1140, 52)">
    
    <!-- Clean Minimalist Frame -->
    <rect width="370" height="292" rx="14" fill="#181820" stroke="#2e2e3e" stroke-width="1"/>

    <!-- Brand Identity Block -->
    <g transform="translate(32, 34)">
      <!-- Master Symbol: Height 52px -->
      <g transform="scale(0.203)">
        <path fill="#ffffff" fill-rule="evenodd" d="M 60 36 H 154 C 182.72 36 206 59.28 206 88 C 206 112.5 188.9 133.05 165.81 140 H 80 V 184 H 124 V 220 H 60 A 16 16 0 0 1 44 204 V 52 A 16 16 0 0 1 60 36 Z M 80 72 V 104 H 154 C 162.84 104 170 96.84 170 88 C 170 79.16 162.84 72 154 72 Z"/>
        <path fill="#ff7759" d="M 165.81 140 L 212 220 H 165.81 L 119.62 140 Z"/>
      </g>
      
      <text class="font-display font-bold" x="66" y="34" font-size="28" letter-spacing="-0.8" fill="#ffffff">
        Creative <tspan fill="#ff7759">Realm</tspan>
      </text>
      <text class="font-mono" x="68" y="50" font-size="10" letter-spacing="2" fill="#88889a">
        DESIGNS &amp; ENGINEERING
      </text>
    </g>

    <line x1="32" y1="104" x2="338" y2="104" stroke="#272735" stroke-width="1"/>

    <g transform="translate(32, 126)">
      <text class="font-mono font-bold" x="0" y="16" font-size="11" fill="#4ade80" letter-spacing="1">
        ● ACCEPTING NEW CLIENTS
      </text>
      <text class="font-body" x="0" y="38" font-size="13" fill="#8f8fa0">
        Turnaround: 2-3 Weeks • Enterprise Grade
      </text>
    </g>

    <g transform="translate(32, 196)">
      <rect width="306" height="52" rx="8" fill="#1f1f2a" stroke="#36364a" stroke-width="1"/>
      <text class="font-mono font-bold" x="18" y="32" font-size="12" fill="#ffffff">
        creativerealmdesigns.com
      </text>
      <text class="font-display font-bold" x="274" y="33" font-size="18" fill="#ff7759">→</text>
    </g>
  </g>
</svg>
