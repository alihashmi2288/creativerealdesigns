<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      .font-display { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .font-mono { font-family: 'Space Mono', monospace; }
      .font-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .font-bold { font-weight: 700; }
      .font-semibold { font-weight: 600; }
      .font-medium { font-weight: 500; }
    </style>
    <linearGradient id="grad-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17171c"/>
      <stop offset="60%" stop-color="#0e1724"/>
      <stop offset="100%" stop-color="#003c33"/>
    </linearGradient>
    <linearGradient id="grad-mesh" x1="0" y1="0" x2="1500" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#17171c"/>
      <stop offset="50%" stop-color="#0c1d2e"/>
      <stop offset="85%" stop-color="#003c33"/>
      <stop offset="100%" stop-color="#17171c"/>
    </linearGradient>
    <linearGradient id="grad-coral" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7759"/>
      <stop offset="100%" stop-color="#ff937b"/>
    </linearGradient>
    <pattern id="arch-grid-dark" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#2a2a35" stroke-width="0.8" stroke-opacity="0.4"/>
      <line x1="0" y1="0" x2="60" y2="60" stroke="#2a2a35" stroke-width="0.5" stroke-dasharray="2,4" stroke-opacity="0.25"/>
    </pattern>
    <pattern id="arch-grid-light" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#d9d9dd" stroke-width="0.8" stroke-opacity="0.6"/>
      <line x1="0" y1="0" x2="60" y2="60" stroke="#d9d9dd" stroke-width="0.5" stroke-dasharray="2,4" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1500" height="500" fill="url(#grad-mesh)"/>
  <rect width="1500" height="500" fill="url(#arch-grid-dark)"/>
  
  <!-- Architectural 60-degree accent vectors -->
  <line x1="1100" y1="0" x2="1388" y2="500" stroke="#ff7759" stroke-width="1.5" stroke-opacity="0.25"/>
  <line x1="1150" y1="0" x2="1438" y2="500" stroke="#ff7759" stroke-width="1" stroke-opacity="0.15"/>
  
  <!-- Subtle ambient glow -->
  <circle cx="1250" cy="180" r="320" fill="#003c33" opacity="0.3" filter="blur(60px)"/>
  
  <!-- Top Bar: Logo & Studio coordinates -->
  
    <g transform="translate(70, 48) scale(0.85)">
      <g transform="scale(0.55)">
        
    <g class="symbol-white">
      <path fill="#ffffff" fill-rule="evenodd" d="M 60 36 H 154 C 182.72 36 206 59.28 206 88 C 206 112.5 188.9 133.05 165.81 140 H 80 V 184 H 124 V 220 H 60 A 16 16 0 0 1 44 204 V 52 A 16 16 0 0 1 60 36 Z M 80 72 V 104 H 154 C 162.84 104 170 96.84 170 88 C 170 79.16 162.84 72 154 72 Z"/>
      <path fill="#ff7759" d="M 165.81 140 L 212 220 H 165.81 L 119.62 140 Z"/>
    </g>
  
      </g>
      <text class="font-display font-bold" x="150" y="86" font-size="44" letter-spacing="-1" fill="#ffffff">
        Creative <tspan fill="#ff7759">Realm</tspan>
      </text>
      <text class="font-mono" x="152" y="114" font-size="13" letter-spacing="2" fill="#93939f">
        DESIGNS &amp; ENGINEERING
      </text>
    </g>
  
  
  <g transform="translate(1120, 64)">
    <rect width="310" height="34" rx="17" fill="#1e1e24" stroke="#2a2a35" stroke-width="1"/>
    <circle cx="20" cy="17" r="4.5" fill="#ff7759"/>
    <text class="font-mono font-medium" x="35" y="22" font-size="12" fill="#93939f" letter-spacing="1">
      GLOBAL STUDIO // 2026
    </text>
  </g>

  <!-- Main Content Cluster (Positioned safely to the right of bottom-left avatar cutout) -->
  <g transform="translate(420, 160)">
    <!-- Category Pill -->
    <rect width="375" height="30" rx="6" fill="#1e1e24" stroke="#2a2a35" stroke-width="1"/>
    <text class="font-mono font-bold" x="14" y="20" font-size="11.5" fill="#ff7759" letter-spacing="1.5">
      BESPOKE WEB ENGINEERING &amp; SEO
    </text>

    <!-- Main Headline -->
    <text class="font-display font-bold" x="0" y="85" font-size="46" letter-spacing="-1.2" fill="#ffffff">
      Ultra-Fast Websites Engineered To Rank &amp; Convert.
    </text>

    <!-- Subhead -->
    <text class="font-body" x="0" y="125" font-size="18" fill="#93939f">
      Hand-crafted Next.js platforms • Sub-second speeds • 100% code ownership • Zero monthly fees
    </text>

    <!-- Metric Badges Row -->
    <g transform="translate(0, 160)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="8" fill="#1e1e24" stroke="#2a2a35" stroke-width="1"/>
        <text class="font-mono font-bold" x="14" y="26" font-size="13" fill="#ff7759">⚡ &lt; 800ms</text>
        <text class="font-body" x="90" y="26" font-size="12" fill="#93939f">Load Speed</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(195, 0)">
        <rect width="210" height="42" rx="8" fill="#1e1e24" stroke="#2a2a35" stroke-width="1"/>
        <text class="font-mono font-bold" x="14" y="26" font-size="13" fill="#ffffff">🔒 100% Code</text>
        <text class="font-body" x="110" y="26" font-size="12" fill="#93939f">&amp; IP Ownership</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(420, 0)">
        <rect width="185" height="42" rx="8" fill="#1e1e24" stroke="#2a2a35" stroke-width="1"/>
        <text class="font-mono font-bold" x="14" y="26" font-size="13" fill="#ff7759">📈 99/100</text>
        <text class="font-body" x="84" y="26" font-size="12" fill="#93939f">Google Speed</text>
      </g>
    </g>

    <!-- CTA Button & Domain -->
    <g transform="translate(0, 230)">
      <rect width="260" height="48" rx="8" fill="url(#grad-coral)"/>
      <text class="font-display font-bold" x="24" y="30" font-size="15" fill="#17171c" letter-spacing="-0.2">
        Schedule Consultation →
      </text>
      <text class="font-mono" x="290" y="30" font-size="13" fill="#75758a" letter-spacing="1">
        creativerealmdesigns.com
      </text>
    </g>
  </g>
</svg>