<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 312" width="820" height="312">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      .font-display { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .font-mono { font-family: 'Space Mono', monospace; }
      .font-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .font-bold { font-weight: 700; }
      .font-semibold { font-weight: 600; }
      .font-medium { font-weight: 500; }
    </style>
    <linearGradient id="grad-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17171c"/>
      <stop offset="60%" stop-color="#0e1724"/>
      <stop offset="100%" stop-color="#003c33"/>
    </linearGradient>
    <linearGradient id="grad-mesh" x1="0" y1="0" x2="1500" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#17171c"/>
      <stop offset="50%" stop-color="#0c1d2e"/>
      <stop offset="85%" stop-color="#003c33"/>
      <stop offset="100%" stop-color="#17171c"/>
    </linearGradient>
    <linearGradient id="grad-coral" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7759"/>
      <stop offset="100%" stop-color="#ff937b"/>
    </linearGradient>
    <pattern id="arch-grid-dark" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#2a2a35" stroke-width="0.8" stroke-opacity="0.4"/>
      <line x1="0" y1="0" x2="60" y2="60" stroke="#2a2a35" stroke-width="0.5" stroke-dasharray="2,4" stroke-opacity="0.25"/>
    </pattern>
    <pattern id="arch-grid-light" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#d9d9dd" stroke-width="0.8" stroke-opacity="0.6"/>
      <line x1="0" y1="0" x2="60" y2="60" stroke="#d9d9dd" stroke-width="0.5" stroke-dasharray="2,4" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="820" height="312" fill="url(#grad-mesh)"/>
  <rect width="820" height="312" fill="url(#arch-grid-dark)"/>

  <!-- Ambient light -->
  <circle cx="680" cy="120" r="180" fill="#003c33" opacity="0.4" filter="blur(40px)"/>

  <!-- Safe central layout -->
  <g transform="translate(110, 36)">
    
    <g transform="translate(0, 0) scale(0.9)">
      <g transform="scale(0.42)">
        
    <g class="symbol-white">
      <path fill="#ffffff" fill-rule="evenodd" d="M 60 36 H 154 C 182.72 36 206 59.28 206 88 C 206 112.5 188.9 133.05 165.81 140 H 80 V 184 H 124 V 220 H 60 A 16 16 0 0 1 44 204 V 52 A 16 16 0 0 1 60 36 Z M 80 72 V 104 H 154 C 162.84 104 170 96.84 170 88 C 170 79.16 162.84 72 154 72 Z"/>
      <path fill="#ff7759" d="M 165.81 140 L 212 220 H 165.81 L 119.62 140 Z"/>
    </g>
  
      </g>
      <text class="font-display font-bold" x="120" y="66" font-size="34" letter-spacing="-0.8" fill="#ffffff">
        Creative <tspan fill="#ff7759">Realm</tspan>
      </text>
    </g>
  

    <g transform="translate(0, 85)">
      <text class="font-display font-bold" x="0" y="32" font-size="28" letter-spacing="-0.8" fill="#ffffff">
        Websites Engineered To Rank On Google.
      </text>
      <text class="font-body" x="0" y="64" font-size="15" fill="#93939f">
        Custom Figma design • Sub-second mobile speed • 100% Code ownership
      </text>
    </g>

    <g transform="translate(0, 185)">
      <!-- CTA Button -->
      <rect width="210" height="42" rx="6" fill="url(#grad-coral)"/>
      <text class="font-display font-bold" x="20" y="27" font-size="13.5" fill="#17171c">
        Book Consultation →
      </text>

      <!-- Metric tag -->
      <g transform="translate(230, 0)">
        <rect width="200" height="42" rx="6" fill="#1e1e24" stroke="#2a2a35" stroke-width="1"/>
        <text class="font-mono font-bold" x="14" y="26" font-size="12" fill="#ff7759">⚡ &lt; 800ms Load Time</text>
      </g>
    </g>
  </g>
</svg>