<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      .font-display { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'Space Mono', monospace; }
      .font-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-bold { font-weight: 700; }
      .font-semibold { font-weight: 600; }
      .font-medium { font-weight: 500; }
    </style>

    <linearGradient id="opt2-dark-scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111115" stop-opacity="0.96"/>
      <stop offset="35%" stop-color="#141419" stop-opacity="0.94"/>
      <stop offset="70%" stop-color="#17171c" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#0a1520" stop-opacity="0.92"/>
    </linearGradient>

    <linearGradient id="opt2-glass-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f1f28" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#14141b" stop-opacity="0.88"/>
    </linearGradient>

    <linearGradient id="opt2-coral-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7759" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff7759" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1584" height="396" fill="#111115"/>

  <!-- Subagent-Generated Monolithic 3D Architectural Background -->
  <image href="bg-monolith-coral.jpg" x="0" y="-120" width="1584" height="891" preserveAspectRatio="xMidYMid slice" opacity="0.36"/>

  <!-- High-Contrast Scrim to Guarantee WCAG AAA Contrast -->
  <rect width="1584" height="396" fill="url(#opt2-dark-scrim)"/>

  <!-- Precision 60-degree Slanted Architectural Divider Accent -->
  <line x1="1100" y1="0" x2="1328" y2="396" stroke="#ff7759" stroke-width="1.8" stroke-opacity="0.45"/>
  <line x1="1140" y1="0" x2="1368" y2="396" stroke="#2e2e3e" stroke-width="1" stroke-opacity="0.5"/>

  <!-- ZONE A: Editorial Content (Safe from Avatar: x = 430 to 1080) -->
  <g transform="translate(430, 48)">
    
    <!-- Agency Pill -->
    <rect width="286" height="28" rx="14" fill="rgba(255, 119, 89, 0.12)" stroke="#ff7759" stroke-width="1" stroke-opacity="0.4"/>
    <text class="font-mono font-bold" x="14" y="18.5" font-size="11" fill="#ff7759" letter-spacing="1.2">
      ⚡ THE SOVEREIGN WEB AGENCY
    </text>

    <!-- Main Headline: Balanced 2-Line Flow -->
    <text class="font-display font-bold" x="0" y="80" font-size="38" letter-spacing="-1.2" fill="#ffffff">
      Ultra-Fast Web Systems
    </text>
    <text class="font-display font-bold" x="0" y="126" font-size="38" letter-spacing="-1.2" fill="#ffffff">
      Engineered To Convert<tspan fill="#ff7759">.</tspan>
    </text>

    <!-- Subtext -->
    <text class="font-body font-medium" x="0" y="168" font-size="15" fill="#a8a8bd">
      Bespoke architecture, sub-second Core Web Vitals, and 100% intellectual property ownership.
    </text>
    <text class="font-body" x="0" y="194" font-size="14" fill="#7d7d92">
      No recurring templates • No platform rent • Pure Next.js 16 engineering
    </text>

    <!-- Value Badges -->
    <g transform="translate(0, 226)">
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="8" fill="rgba(29, 29, 38, 0.9)" stroke="#323244" stroke-width="1"/>
        <text class="font-mono font-medium" x="12" y="22" font-size="11.5" fill="#ffffff">⚡ &lt; 800ms Load Time</text>
      </g>
      <g transform="translate(192, 0)">
        <rect width="180" height="34" rx="8" fill="rgba(29, 29, 38, 0.9)" stroke="#ff7759" stroke-width="1" stroke-opacity="0.5"/>
        <text class="font-mono font-bold" x="12" y="22" font-size="11.5" fill="#ff7759">🛡️ 100% IP Ownership</text>
      </g>
      <g transform="translate(384, 0)">
        <rect width="170" height="34" rx="8" fill="rgba(29, 29, 38, 0.9)" stroke="#323244" stroke-width="1"/>
        <text class="font-mono font-medium" x="12" y="22" font-size="11.5" fill="#ffffff">🎯 Google SEO First</text>
      </g>
    </g>
  </g>

  <!-- ZONE B: Brand & Command Glass Card (x = 1140 to 1516) -->
  <g transform="translate(1140, 48)">
    
    <!-- Frosted Glass Card Container -->
    <rect width="376" height="300" rx="18" fill="url(#opt2-glass-card)" stroke="url(#opt2-coral-stroke)" stroke-width="1.2"/>

    <!-- Brand Header -->
    <g transform="translate(32, 30)">
      <!-- Master Symbol: Height 48px -->
      <g transform="scale(0.1875)">
        <path fill="#ffffff" fill-rule="evenodd" d="M 60 36 H 154 C 182.72 36 206 59.28 206 88 C 206 112.5 188.9 133.05 165.81 140 H 80 V 184 H 124 V 220 H 60 A 16 16 0 0 1 44 204 V 52 A 16 16 0 0 1 60 36 Z M 80 72 V 104 H 154 C 162.84 104 170 96.84 170 88 C 170 79.16 162.84 72 154 72 Z"/>
        <path fill="#ff7759" d="M 165.81 140 L 212 220 H 165.81 L 119.62 140 Z"/>
      </g>
      
      <!-- Wordmark -->
      <text class="font-display font-bold" x="62" y="32" font-size="27" letter-spacing="-0.8" fill="#ffffff">
        Creative <tspan fill="#ff7759">Realm</tspan>
      </text>
      <text class="font-mono font-medium" x="63" y="47" font-size="9.5" letter-spacing="2.2" fill="#88889a">
        DESIGNS &amp; ENGINEERING
      </text>
    </g>

    <!-- Divider -->
    <line x1="32" y1="94" x2="344" y2="94" stroke="#2c2c3e" stroke-width="1"/>

    <!-- Technical Spec Box -->
    <g transform="translate(32, 112)">
      <rect width="312" height="42" rx="8" fill="rgba(18, 18, 24, 0.85)" stroke="#2b2b3a" stroke-width="1"/>
      <circle cx="20" cy="21" r="3.5" fill="#4ade80"/>
      <text class="font-mono font-bold" x="32" y="26" font-size="11" fill="#ffffff" letter-spacing="0.5">
        STACK: <tspan fill="#a0a0b8">NEXT.JS 16 // TAILWIND 4</tspan>
      </text>
    </g>

    <!-- Deployment Status -->
    <g transform="translate(32, 172)">
      <circle cx="8" cy="8" r="4.5" fill="#ff7759"/>
      <circle cx="8" cy="8" r="8" fill="#ff7759" fill-opacity="0.25"/>
      <text class="font-mono font-bold" x="24" y="12" font-size="11" fill="#e4e4ed" letter-spacing="0.8">
        PRODUCTION READY STUDIO
      </text>
    </g>

    <!-- Domain Terminal Link -->
    <g transform="translate(32, 206)">
      <rect width="312" height="54" rx="10" fill="#1b1b24" stroke="#ff7759" stroke-width="1" stroke-opacity="0.35"/>
      <text class="font-mono font-bold" x="18" y="33" font-size="12" fill="#ffffff">
        creativerealmdesigns.com
      </text>
      <text class="font-display font-bold" x="282" y="34" font-size="18" fill="#ff7759">→</text>
    </g>
  </g>
</svg>
