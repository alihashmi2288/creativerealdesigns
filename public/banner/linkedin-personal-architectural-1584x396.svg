<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      .font-display { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'Space Mono', monospace; }
      .font-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-bold { font-weight: 700; }
      .font-semibold { font-weight: 600; }
      .font-medium { font-weight: 500; }
    </style>

    <linearGradient id="opt1-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121216"/>
      <stop offset="40%" stop-color="#17171c"/>
      <stop offset="78%" stop-color="#0a1926"/>
      <stop offset="100%" stop-color="#002d25"/>
    </linearGradient>

    <linearGradient id="opt1-card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#191922"/>
      <stop offset="100%" stop-color="#14141a"/>
    </linearGradient>

    <linearGradient id="opt1-card-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7759"/>
      <stop offset="50%" stop-color="#ff937b"/>
      <stop offset="100%" stop-color="#2c2c3a"/>
    </linearGradient>

    <radialGradient id="opt1-glow" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ff7759" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#ff7759" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ff7759" stop-opacity="0"/>
    </radialGradient>

    <pattern id="opt1-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#252530" stroke-width="0.8" stroke-opacity="0.45"/>
      <line x1="0" y1="0" x2="60" y2="60" stroke="#252530" stroke-width="0.5" stroke-dasharray="2,4" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background Base & Grid -->
  <rect width="1584" height="396" fill="url(#opt1-bg)"/>
  <rect width="1584" height="396" fill="url(#opt1-grid)"/>
  <rect width="1584" height="396" fill="url(#opt1-glow)"/>

  <!-- Architectural 60-degree Structural Beams -->
  <line x1="1080" y1="0" x2="1308" y2="396" stroke="#ff7759" stroke-width="2" stroke-opacity="0.32"/>
  <line x1="1130" y1="0" x2="1358" y2="396" stroke="#2b2b38" stroke-width="1.2" stroke-opacity="0.6"/>
  <line x1="1180" y1="0" x2="1408" y2="396" stroke="#1d1d26" stroke-width="1" stroke-dasharray="4,6" stroke-opacity="0.4"/>

  <!-- ZONE A: Editorial Content (Safe from Avatar: x = 430 to 1090) -->
  <g transform="translate(430, 48)">
    
    <!-- Category Badge -->
    <rect width="324" height="28" rx="6" fill="#1b1b22" stroke="#2e2e3b" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#ff7759"/>
    <text class="font-mono font-bold" x="28" y="18.5" font-size="11" fill="#ff7759" letter-spacing="1.5">
      STUDIO ARCHITECTURE // PRODUCTION SPEC
    </text>

    <!-- Display Headline: Two Lines to Guarantee Zero Lateral Spill -->
    <text class="font-display font-bold" x="0" y="78" font-size="37" letter-spacing="-1.2" fill="#ffffff">
      Custom Web Engineering
    </text>
    <text class="font-display font-bold" x="0" y="124" font-size="37" letter-spacing="-1.2" fill="#ffffff">
      For Ambitious Brands<tspan fill="#ff7759">.</tspan>
    </text>

    <!-- Value Proposition Subtext -->
    <text class="font-body font-medium" x="0" y="166" font-size="15" fill="#a4a4b8">
      Guaranteed sub-second speed • 100% intellectual property ownership
    </text>
    <text class="font-body" x="0" y="192" font-size="14.5" fill="#78788e">
      Zero recurring platform lock-in • Engineered with Next.js 16 &amp; Bespoke Figma
    </text>

    <!-- Proof Badges Grid Row -->
    <g transform="translate(0, 226)">
      <!-- Badge 1: Next.js -->
      <g transform="translate(0, 0)">
        <rect width="158" height="34" rx="6" fill="#1b1b23" stroke="#2e2e3d" stroke-width="1"/>
        <text class="font-mono font-medium" x="12" y="22" font-size="11.5" fill="#ffffff">⚡ Next.js 16 &amp; React</text>
      </g>
      <!-- Badge 2: Bespoke Figma -->
      <g transform="translate(168, 0)">
        <rect width="156" height="34" rx="6" fill="#1b1b23" stroke="#2e2e3d" stroke-width="1"/>
        <text class="font-mono font-medium" x="12" y="22" font-size="11.5" fill="#ffffff">🎨 Bespoke Figma</text>
      </g>
      <!-- Badge 3: 100/100 CWV -->
      <g transform="translate(334, 0)">
        <rect width="168" height="34" rx="6" fill="#1b1b23" stroke="#ff7759" stroke-width="1" stroke-opacity="0.5"/>
        <text class="font-mono font-bold" x="12" y="22" font-size="11.5" fill="#ff7759">📈 100/100 CWV Score</text>
      </g>
      <!-- Badge 4: Zero Lock-in -->
      <g transform="translate(512, 0)">
        <rect width="144" height="34" rx="6" fill="#1b1b23" stroke="#2e2e3d" stroke-width="1"/>
        <text class="font-mono font-medium" x="12" y="22" font-size="11.5" fill="#ffffff">🛡️ Zero Lock-in</text>
      </g>
    </g>
  </g>

  <!-- ZONE B: Dedicated Brand Beacon Card (x = 1140 to 1516, width 376px) -->
  <g transform="translate(1140, 48)">
    
    <!-- Outer Card Shell with 16px Squircles -->
    <rect width="376" height="300" rx="16" fill="url(#opt1-card-bg)" stroke="#2b2b3a" stroke-width="1.2"/>
    
    <!-- Top Accent Hairline -->
    <path d="M 0 16 A 16 16 0 0 1 16 0 H 360 A 16 16 0 0 1 376 16" fill="none" stroke="url(#opt1-card-accent)" stroke-width="2"/>

    <!-- Brand Logo Unit (Strict 1xX Clear Space Guaranteed) -->
    <g transform="translate(30, 28)">
      <!-- Master Symbol: Height 48px -->
      <g transform="scale(0.1875)">
        <path fill="#ffffff" fill-rule="evenodd" d="M 60 36 H 154 C 182.72 36 206 59.28 206 88 C 206 112.5 188.9 133.05 165.81 140 H 80 V 184 H 124 V 220 H 60 A 16 16 0 0 1 44 204 V 52 A 16 16 0 0 1 60 36 Z M 80 72 V 104 H 154 C 162.84 104 170 96.84 170 88 C 170 79.16 162.84 72 154 72 Z"/>
        <path fill="#ff7759" d="M 165.81 140 L 212 220 H 165.81 L 119.62 140 Z"/>
      </g>
      
      <!-- Wordmark -->
      <text class="font-display font-bold" x="62" y="32" font-size="27" letter-spacing="-0.8" fill="#ffffff">
        Creative <tspan fill="#ff7759">Realm</tspan>
      </text>
      <text class="font-mono font-medium" x="63" y="47" font-size="9.5" letter-spacing="2.2" fill="#88889a">
        DESIGNS &amp; ENGINEERING
      </text>
    </g>

    <!-- Structural Divider -->
    <line x1="30" y1="94" x2="346" y2="94" stroke="#272735" stroke-width="1"/>

    <!-- Studio Metrics Band -->
    <g transform="translate(30, 112)">
      <rect width="316" height="42" rx="8" fill="#181820" stroke="#282836" stroke-width="1"/>
      <circle cx="20" cy="21" r="3.5" fill="#ff7759"/>
      <text class="font-mono font-bold" x="32" y="26" font-size="11" fill="#ffffff" letter-spacing="0.5">
        CORE VELOCITY: <tspan fill="#ff7759">&lt; 800ms CWV</tspan>
      </text>
    </g>

    <!-- Studio Status Indicator -->
    <g transform="translate(30, 172)">
      <circle cx="8" cy="8" r="4.5" fill="#4ade80"/>
      <circle cx="8" cy="8" r="8" fill="#4ade80" fill-opacity="0.2"/>
      <text class="font-mono font-bold" x="24" y="12" font-size="11" fill="#e0e0ea" letter-spacing="0.8">
        ACCEPTING FOUNDER BUILDS
      </text>
    </g>

    <!-- Terminal URL Bar -->
    <g transform="translate(30, 206)">
      <rect width="316" height="54" rx="8" fill="#1d1d27" stroke="#323244" stroke-width="1"/>
      <text class="font-mono font-bold" x="18" y="33" font-size="12" fill="#ffffff">
        creativerealmdesigns.com
      </text>
      <text class="font-display font-bold" x="286" y="34" font-size="18" fill="#ff7759">→</text>
    </g>
  </g>
</svg>
