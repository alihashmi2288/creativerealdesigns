<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      .font-display { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .font-mono { font-family: 'Space Mono', monospace; }
      .font-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .font-bold { font-weight: 700; }
      .font-semibold { font-weight: 600; }
      .font-medium { font-weight: 500; }
    </style>
    <linearGradient id="grad-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17171c"/>
      <stop offset="60%" stop-color="#0e1724"/>
      <stop offset="100%" stop-color="#003c33"/>
    </linearGradient>
    <linearGradient id="grad-mesh" x1="0" y1="0" x2="1500" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#17171c"/>
      <stop offset="50%" stop-color="#0c1d2e"/>
      <stop offset="85%" stop-color="#003c33"/>
      <stop offset="100%" stop-color="#17171c"/>
    </linearGradient>
    <linearGradient id="grad-coral" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7759"/>
      <stop offset="100%" stop-color="#ff937b"/>
    </linearGradient>
    <pattern id="arch-grid-dark" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#2a2a35" stroke-width="0.8" stroke-opacity="0.4"/>
      <line x1="0" y1="0" x2="60" y2="60" stroke="#2a2a35" stroke-width="0.5" stroke-dasharray="2,4" stroke-opacity="0.25"/>
    </pattern>
    <pattern id="arch-grid-light" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#d9d9dd" stroke-width="0.8" stroke-opacity="0.6"/>
      <line x1="0" y1="0" x2="60" y2="60" stroke="#d9d9dd" stroke-width="0.5" stroke-dasharray="2,4" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1080" height="1920" fill="url(#grad-mesh)"/>
  <rect width="1080" height="1920" fill="url(#arch-grid-dark)"/>

  <!-- 60-degree architectural geometry -->
  <line x1="500" y1="0" x2="1608" y2="1920" stroke="#ff7759" stroke-width="2" stroke-opacity="0.2"/>
  <line x1="600" y1="0" x2="1708" y2="1920" stroke="#2a2a35" stroke-width="1.5"/>

  <!-- Safe Area content starts at y: 220 -->
  <g transform="translate(90, 240)">
    <!-- Logo -->
    
    <g transform="translate(0, 0) scale(1)">
      <g transform="scale(0.55)">
        
    <g class="symbol-white">
      <path fill="#ffffff" fill-rule="evenodd" d="M 60 36 H 154 C 182.72 36 206 59.28 206 88 C 206 112.5 188.9 133.05 165.81 140 H 80 V 184 H 124 V 220 H 60 A 16 16 0 0 1 44 204 V 52 A 16 16 0 0 1 60 36 Z M 80 72 V 104 H 154 C 162.84 104 170 96.84 170 88 C 170 79.16 162.84 72 154 72 Z"/>
      <path fill="#ff7759" d="M 165.81 140 L 212 220 H 165.81 L 119.62 140 Z"/>
    </g>
  
      </g>
      <text class="font-display font-bold" x="150" y="86" font-size="44" letter-spacing="-1" fill="#ffffff">
        Creative <tspan fill="#ff7759">Realm</tspan>
      </text>
      <text class="font-mono" x="152" y="114" font-size="13" letter-spacing="2" fill="#93939f">
        DESIGNS &amp; ENGINEERING
      </text>
    </g>
  

    <!-- Main question / hook -->
    <g transform="translate(0, 180)">
      <rect width="380" height="38" rx="8" fill="#1e1e24" stroke="#2a2a35" stroke-width="1"/>
      <text class="font-mono font-bold" x="18" y="25" font-size="13" fill="#ff7759" letter-spacing="1.5">
        BESPOKE WEB ENGINEERING
      </text>

      <text class="font-display font-bold" x="0" y="110" font-size="64" letter-spacing="-2" fill="#ffffff">
        Does Your
      </text>
      <text class="font-display font-bold" x="0" y="185" font-size="64" letter-spacing="-2" fill="#ffffff">
        Website Load in
      </text>
      <text class="font-display font-bold" x="0" y="260" font-size="64" letter-spacing="-2" fill="#ff7759">
        Under 800ms?
      </text>

      <text class="font-body" x="0" y="325" font-size="22" fill="#93939f">
        65% of high-ticket clients browse on mobile. If your website is slow, you are losing sales.
      </text>
    </g>

    <!-- 3 Pillar Feature Cards -->
    <g transform="translate(0, 640)">
      <!-- Pillar 1 -->
      <g transform="translate(0, 0)">
        <rect width="900" height="130" rx="12" fill="#1e1e24" stroke="#2a2a35" stroke-width="1"/>
        <text class="font-mono font-bold" x="32" y="44" font-size="14" fill="#ff7759">01 / BESPOKE FIGMA</text>
        <text class="font-display font-bold" x="32" y="78" font-size="24" fill="#ffffff">Custom Visual Architecture</text>
        <text class="font-body" x="32" y="106" font-size="15" fill="#93939f">Crafted from scratch to position your company as an authority.</text>
      </g>

      <!-- Pillar 2 -->
      <g transform="translate(0, 150)">
        <rect width="900" height="130" rx="12" fill="#1e1e24" stroke="#2a2a35" stroke-width="1"/>
        <text class="font-mono font-bold" x="32" y="44" font-size="14" fill="#ff7759">02 / HAND-CRAFTED SPEED</text>
        <text class="font-display font-bold" x="32" y="78" font-size="24" fill="#ffffff">Sub-Second Next.js Engineering</text>
        <text class="font-body" x="32" y="106" font-size="15" fill="#93939f">Zero slow plugins, zero bloated page builders. Guaranteed sub-800ms.</text>
      </g>

      <!-- Pillar 3 -->
      <g transform="translate(0, 300)">
        <rect width="900" height="130" rx="12" fill="#1e1e24" stroke="#2a2a35" stroke-width="1"/>
        <text class="font-mono font-bold" x="32" y="44" font-size="14" fill="#ff7759">03 / 100% OWNERSHIP</text>
        <text class="font-display font-bold" x="32" y="78" font-size="24" fill="#ffffff">Zero Platform Fees</text>
        <text class="font-body" x="32" y="106" font-size="15" fill="#93939f">You own full source code &amp; IP. Host anywhere with zero lock-in.</text>
      </g>
    </g>

    <!-- Bottom Action Card (Above bottom 250px UI zone) -->
    <g transform="translate(0, 1170)">
      <rect width="900" height="120" rx="16" fill="url(#grad-coral)"/>
      <text class="font-display font-bold" x="40" y="55" font-size="28" fill="#17171c">
        Tap Link in Bio for Free Audit ↗
      </text>
      <text class="font-mono" x="40" y="88" font-size="15" fill="#17171c">
        creativerealmdesigns.com • Guaranteed 24hr response
      </text>
    </g>
  </g>
</svg>